[tool.poetry]
name = "djangorest"
version = "0.1.0"
description = ""
authors = ["Christine Ekke <k.ekke2906@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
isort = "^7.0.0"
black = "^25.12.0"
mypy = "^1.19.1"
django = "^6.0"
serializers = "^0.2.4"


[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
exclude = '''
(
  /(
      \.git
  )/
)
'''

[tool.isort]
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv'